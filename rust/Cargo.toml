[package]
name = "powerfitrs"
version = "0.1.0"
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html
[lib]
name = "powerfitrs"
crate-type = ["cdylib"]

[dependencies]
pyo3 = "0.28.3"
numpy = "0.28.0"
ndarray = { version = "0.17", features = ["rayon"] }
ndrustfft = "0.6"
num-complex = "0.4"
rayon = "1"

[profile.dev]
# `maturin develop` uses Cargo's dev profile by default.
# Keep debug symbols for iteration, but compile hot loops with optimization
# so runtime performance is representative for CPU benchmarks.
opt-level = 3

[profile.release]
codegen-units = 1
lto = "thin"
