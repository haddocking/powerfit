name: Build and upload to PyPI

on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'Reference to checkout'
        required: true
        default: 'master'
  pull_request:
  push:
    branches:
      - master
  release:
    types:
      - published

jobs:
  build_wheels:
    name: Build wheels on ${{ matrix.os }}
    runs-on: ${{ matrix.runs-on }}
    strategy:
      matrix:
        os: [ linux-intel, linux-arm, macOS-arm ]
        include:
          - archs: auto64
            platform: auto
          - os: linux-intel
            runs-on: ubuntu-latest
          - os: linux-arm
            runs-on: ubuntu-24.04-arm
          - os: macOS-arm
            # macos-14+ (including latest) are ARM64 runners
            runs-on: macos-latest
            archs: auto64
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.inputs.ref }}
      - name: Build wheels
        uses: pypa/cibuildwheel@v4.0.0
        env:
          CIBW_PLATFORM: ${{ matrix.platform }}
          CIBW_ARCHS: ${{ matrix.archs }}
      - uses: actions/upload-artifact@v7
        with:
          name: cibw-wheels-${{ matrix.os }}-${{ strategy.job-index }}
          path: ./wheelhouse/*.whl

  build_wasm:
    name: Build wasm wheel (Pyodide)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.ref }}
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: "pip"
      - name: Setup Rust target
        run: rustup target add wasm32-unknown-emscripten
      - name: Install Pyodide build tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyodide-build==0.34.3 pyodide-lock==0.1.3 wheel==0.47.0 "maturin>=1.13,<2.0"
      - name: Build wasm wheel
        run: |
          pyodide xbuildenv install 314.0.0a1
          pyodide build . --outdir wheelhouse
      - uses: actions/upload-artifact@v4
        with:
          name: cibw-wheels-pyodide-0
          path: ./wheelhouse/*.whl

  build_sdist:
    name: Build source distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.inputs.ref }}
      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: "pip"
      - name: Install build
        run: pip install build
      - name: Build sdist
        run: python3 -m build --sdist
      - uses: actions/upload-artifact@v7
        with:
          name: cibw-sdist
          path: dist/*.tar.gz

  upload_pypi:
    needs: [build_wheels, build_wasm, build_sdist]
    runs-on: ubuntu-latest
    environment:
        name: pypi
        url: https://pypi.org/p/powerfit-em
    permissions:
        id-token: write
    if: github.event_name == 'release' && github.event.action == 'published'
    steps:
      - uses: actions/download-artifact@v8
        with:
          # unpacks all CIBW artifacts into dist/
          pattern: cibw-*
          path: dist
          merge-multiple: true
      - name: Remove wasm wheel, not supported by PyPI
        run: rm -f dist/powerfit_em-*wasm32.whl
      - uses: pypa/gh-action-pypi-publish@v1.14.0

  upload_wasm_github_release:
    needs: [build_wasm]
    runs-on: ubuntu-latest
    if: github.event_name == 'release' && github.event.action == 'published'
    steps:
      - uses: actions/download-artifact@v4
        with:
          # unpacks all pyodide CIBW artifacts into dist/
          pattern: cibw-wheels-pyodide-*
          path: dist
          merge-multiple: true
      - name: Upload wasm wheel to just created GitHub release
        uses: shogo82148/actions-upload-release-asset@v1
        with:
          asset_path: "dist/*.whl"
          upload_url: ${{ github.event.release.upload_url }}
          asset_content_type: "application/zip"
