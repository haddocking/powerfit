name: ci

on: push

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        # python-version: ["3.11", "3.12", "3.13", "3.14"]
        python-version: ["3.14"]
        # include:
        #   # Windows: no OpenCL system deps/tests, single Python version for now
        #   - os: windows-latest
        #     python-version: "3.14"

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: install system deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ocl-icd-opencl-dev ocl-icd-libopencl1

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust

      - run: pip install -e .[dev,pocl]

      # - name: install python deps from pypi (Linux, with OpenCL)
      #   if: runner.os == 'Linux'
      #   run: pip install -e .[dev,pocl]
      #
      # - name: install python deps from pypi (Windows, no OpenCL)
      #   if: runner.os == 'Windows'
      #   run: pip install -e .[dev]

      - name: OpenCL platform and device test
        # if: runner.os == 'Linux'
        run: python -c 'import pyopencl as cl;from pyvkfft.fft import rfftn; ps=cl.get_platforms();print(ps);print(ps[0].get_devices())'

      - name: run clippy
        working-directory: rust
        run: cargo clippy --all --locked -- -D warnings

      - name: Run Rust tests
        working-directory: rust
        run: cargo test --all --locked --verbose

      - name: test
        run: >-
          pytest --cov=src --cov-report xml:coverage.xml -vvv

      - uses: codacy/codacy-coverage-reporter-action@v1
        if: >-
          ${{ matrix.os == 'ubuntu-latest' && matrix.python-version == '3.14' &&
          (github.event_name != 'pull_request' ||
          github.event.pull_request.head.repo.full_name == github.repository) }}
        with:
          project-token: ${{ secrets.CODACY_PROJECT_TOKEN }}
          coverage-reports: ./coverage.xml

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      - name: install python deps from pypi
        run: pip install -e .[dev]
      - name: Check style against standards using ruff
        run: |
          ruff check
          ruff format --check
