name: ci

on: push

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y ocl-icd-opencl-dev ocl-icd-libopencl1

      - name: install python deps from pypi
        run: pip install -e .[dev,pocl]

      - name: OpenCL platform and device test
        run: python -c 'import pyopencl as cl;from pyvkfft.fft import rfftn; ps=cl.get_platforms();print(ps);print(ps[0].get_devices())'

      - name: test
        run: >-
          pytest --cov=src --cov-report xml:coverage.xml -vvv

      - uses: codacy/codacy-coverage-reporter-action@v1
        if: >-
          ${{ github.event_name != 'pull_request' ||
          github.event.pull_request.head.repo.full_name == github.repository }}
        with:
          project-token: ${{ secrets.CODACY_PROJECT_TOKEN }}
          coverage-reports: ./coverage.xml

  rust-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@v4
      - name: Set up Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
      - name: Run Rust tests
        run: cargo test --all --locked --verbose

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: install python deps from pypi
        run: pip install -e .[dev]
      - name: Check style against standards using ruff
        run: |
          ruff check
          ruff format --check
