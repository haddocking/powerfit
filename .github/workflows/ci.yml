name: ci

on: push
# on: workflow_dispatch

jobs:
  # Decide whether the code has to be tested. Pushes to the default branch,
  # tags and new branches always are. On other branches, the jobs are skipped
  # when the branch changes no code compared with the default branch (only
  # *.md files), or when a push does not change the code of the branch (e.g. a
  # merge of the default branch) and ci-passed succeeded on the previous commit.
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: read
    outputs:
      code: ${{ steps.code.outputs.code }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: check whether the code changed
        id: code
        env:
          GH_TOKEN: ${{ github.token }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          DEFAULT: ${{ github.event.repository.default_branch }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: |
          set -o pipefail
          code=true
          if [ "$REF_TYPE" = branch ] && [ "$REF_NAME" != "$DEFAULT" ]; then
            # everything but the *.md files counts as code
            paths=(. ':(exclude,glob)**/*.md')
            # diff of the branch itself (against its merge base with the default
            # branch); patch-id ignores line numbers, so that merging the default
            # branch does not count as a change
            patch_id() {
              git diff "$(git merge-base "origin/$DEFAULT" "$1")" "$1" -- "${paths[@]}" \
                | git patch-id --stable | cut -d' ' -f1
            }
            if ! git fetch -q --no-tags origin "$DEFAULT"; then
              echo "Could not fetch ${DEFAULT}: testing everything."
            elif ! after=$(patch_id "$AFTER"); then
              echo "Could not compare the branch with its base: testing everything."
            elif [ -z "$after" ]; then
              code=false
              echo "The branch changes no code compared with ${DEFAULT}."
            elif [ "$BEFORE" != 0000000000000000000000000000000000000000 ] \
              && git fetch -q --no-tags origin "$BEFORE" \
              && before=$(patch_id "$BEFORE") && [ "$before" = "$after" ]; then
              # skipped jobs would hide failures: only skip when ci-passed
              # succeeded on the previous commit
              passed=$(gh api "repos/${GITHUB_REPOSITORY}/commits/${BEFORE}/check-runs" \
                --jq '[.check_runs[] | select(.name == "ci-passed")]
                      | (length > 0) and all(.conclusion == "success")' || echo false)
              if [ "$passed" = true ]; then
                code=false
                echo "The code of the branch is unchanged and ci-passed succeeded on ${BEFORE}."
              else
                echo "The code of the branch is unchanged, but ci-passed did not succeed on ${BEFORE}."
              fi
            fi
          fi
          echo "code=${code}"
          echo "code=${code}" >> "$GITHUB_OUTPUT"

  test:
    needs: [changes]
    if: needs.changes.outputs.code == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.11", "3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: install system deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ocl-icd-opencl-dev ocl-icd-libopencl1

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust

      - name: install python deps from pypi (Linux, with OpenCL)
        if: runner.os == 'Linux'
        run: pip install -e .[dev,pocl]

      - name: install python deps from pypi (Windows/macOS, no OpenCL)
        if: runner.os != 'Linux'
        run: pip install -e .[dev]

      - name: OpenCL platform and device test
        if: runner.os == 'Linux'
        run: python -c 'import pyopencl as cl;from pyvkfft.fft import rfftn; ps=cl.get_platforms();print(ps);print(ps[0].get_devices())'

      - name: rust tests
        working-directory: rust
        run: cargo test --all --locked

      - name: python tests
        run: pytest --cov=src --cov-report xml:coverage.xml -vvv

      - uses: codacy/codacy-coverage-reporter-action@v1
        continue-on-error: true
        if: >-
          ${{ matrix.os == 'ubuntu-latest' && matrix.python-version == '3.14' &&
          (github.event_name != 'pull_request' ||
          github.event.pull_request.head.repo.full_name == github.repository) }}
        with:
          project-token: ${{ secrets.CODACY_PROJECT_TOKEN }}
          coverage-reports: ./coverage.xml

  lint:
    needs: [changes]
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust

      - name: install
        run: pip install -e .[dev]

      - name: clippy
        working-directory: rust
        run: cargo clippy --all --locked -- -D warnings

      - name: Check style against standards using ruff
        run: |
          ruff check
          ruff format --check

  ci-passed:
    # One check summarising all jobs, also when they were skipped because the
    # code did not change.
    if: always()
    needs: [changes, test, lint]
    runs-on: ubuntu-latest
    steps:
      - name: all jobs passed
        run: |
          echo 'test: ${{ needs.test.result }}, lint: ${{ needs.lint.result }}'
          test '${{ needs.changes.result }}' = success
          if [ '${{ needs.changes.outputs.code }}' = false ]; then
            echo 'No code to test (see the changes job).'
            exit 0
          fi
          test '${{ needs.test.result }}' = success
          test '${{ needs.lint.result }}' = success
