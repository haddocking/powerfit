[build-system]
requires = ["maturin>=1.13,<2.0"]
build-backend = "maturin"

[project]
name = "powerfit-em"
description = "Rigid body fitting of high-resolution structures in low-resolution cryo-electron microscopy density maps"
authors = [{ name = "Gydo C.P. van Zundert", email = "g.c.p.vanzundert@uu.nl" }]
maintainers = [{ name = "BonvinLab" }, { email = "bonvinlab.support@uu.nl" }]
requires-python = ">=3.10"
readme = {file = "README.md", content-type = "text/markdown"}
dynamic = ["version"]
license = "Apache-2.0"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Intended Audience :: Science/Research", 
    "Topic :: Scientific/Engineering :: Bio-Informatics"
]
dependencies = [
    "numpy>=1.8",
    "more-itertools>=10.0; python_version < '3.12'",
    # pyfftw binary wheel is not available on wasm or on macOS <14 arm, so fallback to numpy for wasm and macOS
    "pyfftw>=0.12.0; platform_machine != 'wasm32' and sys_platform != 'darwin'",
    "scipy",
    "tqdm",
    "rich",
    "molviewspec>=1.6.0",
]

[project.optional-dependencies]
opencl = ["pyopencl", "siphash24", "pyvkfft"]
pocl = ["pyopencl[pocl]", "siphash24", "pyvkfft"]
cuda13x = ["cupy-cuda13x", "siphash24", "pyvkfft"]
cuda12x = ["cupy-cuda12x", "siphash24", "pyvkfft"]
dev = [
    "pytest",
    "pytest-cov",
    "ruff",
    "cython-lint",
    "pandas>=2.3.3",
    "pooch",
    "maturin>=1.13.1",
]
docs = [
    "mkdocs>=1.6.1",
    "mkdocs-charts-plugin>=0.0.13",
    "mkdocs-material>=9.6.14",
    "mkdocs-rich-argparse>=0.1.3",
    "mkdocstrings-python>=2.0.1",
]

[project.urls]
issues = "https://github.com/haddocking/powerfit"
homepage = "https://github.com/haddocking/powerfit"
documentation = "https://bonvinlab.org/powerfit"
source = "https://github.com/haddocking/powerfit"
tutorial = "https://www.bonvinlab.org/education/Others/"

[project.scripts]
powerfit = "powerfit_em.powerfit:main"

[tool.maturin]
manifest-path = "rust/Cargo.toml"
python-source = "src"
module-name = "powerfit_em.powerfit_rs"
include = [
    { path = "README.md", format = "sdist" },
    "powerfit_em/data/*.npy",
    "powerfit_em/correlators/kernels.cl",
    "powerfit_em/correlators/kernels.cu",
]

[tool.cibuildwheel]
# Skip build that do not work or are not needed
skip = "cp314-manylinux* cp314-musllinux* cp314-macosx* cp314-win* cp310-musllinux* cp311-musllinux* cp312-musllinux* *universal2"
archs = ["auto64"]
test-command = "powerfit --help"

[tool.cibuildwheel.pyodide]
# Pin Pyodide for deterministic wasm wheel tags/build environment.
pyodide-version = "314.0.0a1"
# Prefer `python -m` entrypoints for pyodide test env reliability.
test-command = "python -m powerfit_em.powerfit --help"

# For some reason the source wheel for pyfftw is used instead of the binary wheel
# so we install its compilation dependencies manually
# Outside cibuildwheel images it installs the binary wheel
[[tool.cibuildwheel.overrides]]
select = "cp*-manylinux*"
before-test = "yum install -y fftw-devel"

[[tool.cibuildwheel.overrides]]
select = "*-musllinux*"
before-all = "apk add fftw-dev"

[tool.pytest.ini_options]
markers = [
    "requires_cuda: test requires CUDA hardware and cupy package",
    "requires_opencl: test requires OpenCL platform/device and pyopencl package",
    "gpu_integration: test is a GPU integration test requiring hardware",
]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = [
    # pycodestyle
    "E",
    # Pyflakes
    "F",
    # pyupgrade
    "UP",
    # flake8-bugbear
    "B",
    # flake8-simplify
    "SIM",
    # isort
    "I",
    # flake8-bandit assert
    "S101",
]
pydocstyle.convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101"]

[tool.ruff.lint.isort]
known-first-party = ["powerfit_em"]
